<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#212121">
<title>Qiqxar — Information Without Noise</title>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

<style>
:root {
    --bg: #212121;
    --sidebar: #171717;
    --surface: #2f2f2f;
    --surface-hover: #383838;
    --text: #ececec;
    --muted: #a0a0a0;
    --border: rgba(255,255,255,.09);
    --accent: #a8c7fa;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    overflow: hidden;
}

button, textarea, input {
    font: inherit;
}

button {
    cursor: pointer;
    color: inherit;
}

.app {
    display: flex;
    height: 100dvh;
    width: 100%;
}

/* SIDEBAR */

.sidebar {
    width: 270px;
    min-width: 270px;
    background: var(--sidebar);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
    transition: margin .25s;
    z-index: 20;
}

.sidebar.closed {
    margin-left: -270px;
}

.sidebar-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 3px 5px 22px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -.5px;
}

.logo {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg,#4285f4,#9b72cb,#d96570);
    display: grid;
    place-items: center;
    font-weight: bold;
    color: white;
    font-size: 19px;
}

.small-btn {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 9px;
    border-radius: 9px;
    font-size: 18px;
}

.small-btn:hover {
    background: var(--surface-hover);
    color: var(--text);
}

.sidebar-action {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    border: 0;
    background: transparent;
    padding: 12px;
    border-radius: 10px;
    text-align: left;
    font-size: 14px;
    color: var(--text);
}

.sidebar-action:hover {
    background: var(--surface-hover);
}

.sidebar-action .symbol {
    width: 20px;
    text-align: center;
    font-size: 17px;
}

.search-wrap {
    margin: 7px 0 20px;
}

.search-input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    font-size: 13px;
}

.search-input:focus {
    border-color: var(--accent);
}

.section-label {
    color: var(--muted);
    font-size: 12px;
    padding: 8px 10px;
}

#history-list {
    overflow-y: auto;
    flex: 1;
}

.history-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px;
    border-radius: 8px;
}

.history-item.active,
.history-item:hover {
    background: var(--surface-hover);
}

.history-open {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    padding: 10px;
    text-align: left;
    font-size: 13px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.history-menu {
    background: transparent;
    border: 0;
    color: var(--muted);
    padding: 7px;
    border-radius: 6px;
}

.history-menu:hover {
    background: #444;
}

.sidebar-bottom {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    margin-top: 10px;
}

.profile-button {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    width: 100%;
    border: 0;
    border-radius: 9px;
    background: transparent;
    text-align: left;
}

.profile-button:hover {
    background: var(--surface-hover);
}

.profile-avatar {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    background: #4b5563;
    border-radius: 50%;
    font-weight: bold;
}

/* MAIN AREA */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
}

.topbar {
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.top-left, .top-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.top-title {
    font-size: 15px;
    font-weight: 550;
}

.status-label {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 9px;
}

.chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 28px 20px 35px;
    scroll-behavior: smooth;
}

.chat-column {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 28px;
}

/* WELCOME */

#welcome-screen {
    margin: auto 0;
    padding: 8vh 0 4vh;
}

.welcome-title {
    font-size: clamp(30px,5vw,42px);
    font-weight: 550;
    letter-spacing: -1.5px;
    margin-bottom: 10px;
}

.gradient-text {
    background: linear-gradient(100deg,#8ab4f8,#c58af9,#e69aab);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.welcome-subtitle {
    color: var(--muted);
    font-size: 20px;
    margin-bottom: 32px;
}

.suggestions {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 10px;
}

.suggestion {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 15px;
    text-align: left;
    border-radius: 13px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
}

.suggestion:hover {
    background: var(--surface-hover);
}

.suggestion strong {
    display: block;
    margin-bottom: 5px;
    font-size: 14px;
}

/* MESSAGES */

.user-row {
    display: flex;
    justify-content: flex-end;
    width: 100%;
}

.user-bubble {
    max-width: 82%;
    background: #303030;
    border-radius: 21px;
    border-bottom-right-radius: 5px;
    padding: 12px 17px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.bot-row {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.bot-main {
    display: flex;
    gap: 13px;
    align-items: flex-start;
}

.bot-icon {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(135deg,#4285f4,#9b72cb,#d96570);
    display: grid;
    place-items: center;
    color: white;
    font-weight: bold;
    font-size: 16px;
}

.bot-content {
    min-width: 0;
    flex: 1;
    font-size: 15px;
    line-height: 1.75;
    overflow-wrap: anywhere;
}

.bot-content p {
    margin-bottom: 13px;
}

.bot-content p:last-child {
    margin-bottom: 0;
}

.bot-content h1,
.bot-content h2,
.bot-content h3 {
    margin: 18px 0 9px;
    line-height: 1.35;
}

.bot-content ul,
.bot-content ol {
    margin: 10px 0 15px 24px;
}

.bot-content li {
    margin-bottom: 6px;
}

.bot-content pre {
    overflow-x: auto;
    background: #171717;
    border: 1px solid var(--border);
    padding: 14px;
    border-radius: 10px;
    margin: 12px 0;
}

.bot-content code {
    background: #343434;
    padding: 2px 5px;
    border-radius: 5px;
    font-size: 13px;
}
